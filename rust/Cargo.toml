[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"
repository = "https://github.com/elkpi/oxa"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
oxa-ir = { version = "0.1.0", path = "crates/oxa-ir" }
oxa-modelmap = { version = "0.1.0", path = "crates/oxa-modelmap" }
