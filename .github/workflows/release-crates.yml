name: release-crates

on:
  workflow_dispatch:
  push:
    tags: ["rust/v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Verify tag matches workspace package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#rust/v}"
          CARGO_VERSION=$(grep -A 5 '\[workspace\.package\]' rust/Cargo.toml | grep '^version = ' | head -n1 | sed -E 's/version = "(.*)"/\1/')
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "Error: tag $GITHUB_REF_NAME does not match rust/Cargo.toml workspace version $CARGO_VERSION"
            exit 1
          fi
      - name: Clippy gate
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test gate
        working-directory: rust
        run: cargo test --workspace
      - name: Publish crates to crates.io
        run: bash scripts/publish-registries.sh --rust-only
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
