name: ci

on:
  push:
    branches: [main]
    tags: ["**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Detect Go module
        id: go_module
        run: |
          if [ ! -f go/go.mod ]; then
            echo "go/go.mod not yet available — skipping"
          fi
      - uses: actions/setup-go@v7
        if: hashFiles('go/go.mod') != ''
        with:
          go-version: "1.24.x"
          cache-dependency-path: go/go.sum
      - name: Check gofmt
        if: hashFiles('go/go.mod') != ''
        working-directory: go/
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        if: hashFiles('go/go.mod') != ''
        working-directory: go/
        run: go vet ./...
      - name: golangci-lint
        if: hashFiles('go/go.mod') != ''
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: go/
      - name: Check for GH_USER placeholder
        if: hashFiles('go/go.mod') != ''
        working-directory: go/
        run: |
          if grep -rn --include="*.go" "GH_USER" . || { test -f go.mod && grep -n "GH_USER" go.mod; }; then
            echo "Found GH_USER placeholder: replace the placeholder module path before merging."
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.23.x", "1.24.x"]
    steps:
      - uses: actions/checkout@v7
      - name: Detect Go module
        run: |
          if [ ! -f go/go.mod ]; then
            echo "go/go.mod not yet available — skipping"
          fi
      - uses: actions/setup-go@v7
        if: hashFiles('go/go.mod') != ''
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: go/go.sum
      - name: Run tests
        if: hashFiles('go/go.mod') != ''
        working-directory: go/
        run: go test ./... -race -covermode=atomic

  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Detect veccheck
        run: |
          if [ ! -d go/cmd/veccheck ]; then
            echo "go/cmd/veccheck not yet available — skipping"
          fi
      - uses: actions/setup-go@v7
        if: hashFiles('go/cmd/veccheck/**') != ''
        with:
          go-version: "1.24.x"
          cache-dependency-path: go/go.sum
      - name: Run vector checks
        if: hashFiles('go/cmd/veccheck/**') != ''
        working-directory: go/
        run: go run ./cmd/veccheck -root ..

  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Detect veccheck
        run: |
          if [ ! -d go/cmd/veccheck ]; then
            echo "go/cmd/veccheck not yet available — skipping"
          fi
      - uses: actions/setup-go@v7
        if: hashFiles('go/cmd/veccheck/**') != ''
        with:
          go-version: "1.24.x"
          cache-dependency-path: go/go.sum
      - name: Verify vectors manifest
        if: hashFiles('go/cmd/veccheck/**') != ''
        working-directory: go/
        run: go run ./cmd/veccheck -root .. -check-manifest

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Check rustfmt
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests

  cpp:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        flags: [""]
        include:
          - os: ubuntu-latest
            flags: "-DCMAKE_CXX_FLAGS=-fno-exceptions"
    steps:
      - uses: actions/checkout@v7
      - name: Configure CMake
        run: cmake -B cpp/build -S cpp -DCMAKE_BUILD_TYPE=Debug ${{ matrix.flags }}
      - name: Build C++ library and tests
        run: cmake --build cpp/build --config Debug --parallel
      - name: Run C++ tests
        run: ctest --test-dir cpp/build -C Debug --output-on-failure

  release-guard:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7
      - name: Fail if module path is still a placeholder
        run: |
          if [ -f go/go.mod ] && grep -q "oxa-protocol" go/go.mod; then
            echo "go/go.mod still uses the placeholder module path containing 'oxa-protocol'."
            echo "Replace it with the real module path before tagging a release."
            exit 1
          fi
