name: release-pypi

on:
  workflow_dispatch:
  push:
    tags: ["py/v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: python/
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#py/v}"
          PY_VERSION=$(grep '^version = ' pyproject.toml | head -n1 | sed -E 's/version = "(.*)"/\1/')
          if [ "$TAG_VERSION" != "$PY_VERSION" ]; then
            echo "Error: tag $GITHUB_REF_NAME does not match python/pyproject.toml version $PY_VERSION"
            exit 1
          fi
      - name: Test gate
        working-directory: python/
        run: PYTHONPATH=src python -m unittest discover -s tests
      - name: Publish elkpi-oxa to PyPI
        run: bash scripts/publish-registries.sh --python-only
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN || secrets.PYPI_TOKEN || '' }}
