name: release-npm

on:
  workflow_dispatch:
  push:
    tags: ["ts/v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: ts/package-lock.json
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24.x"
          cache-dependency-path: go/go.sum
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: ts/
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#ts/v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "tag $GITHUB_REF_NAME does not match ts/package.json version $PKG_VERSION"
            exit 1
          fi
      - name: Install TypeScript tooling
        working-directory: ts/
        run: npm ci
      - name: Full release gate
        working-directory: ts/
        run: npm run release:check
      - name: Publish @elkpi/oxa
        working-directory: ts/
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "${PKG_NAME}@${PKG_VERSION}" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "${PKG_NAME}@${PKG_VERSION} is already published on npm, skipping upload."
            exit 0
          fi
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
